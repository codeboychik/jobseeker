spring.application.name=jobseeker
server.port=${PORT:8080}
server.address=${BIND_ADDRESS:0.0.0.0}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobseeker}
spring.datasource.username=${DB_USER:jobseeker}
spring.datasource.password=${DB_PASSWORD:jobseeker}
spring.datasource.hikari.maximum-pool-size=8
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:11MB}
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
jobseeker.timezone=${APP_TIMEZONE:Europe/Prague}
jobseeker.upload-limit=${UPLOAD_LIMIT_BYTES:10485760}
